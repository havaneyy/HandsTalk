<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HandsTalk - Sign Up or Log In</title>
    <link rel="stylesheet" href="sign up.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:ital,wght@0,300;0,900;1,300&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <div class="main-card">
            <!-- Background layers -->
            <div class="background-layer"></div>
            <div class="sea-overlay"></div>
            
            <!-- Navigation -->
            <nav class="navbar">
                <div class="logo">
                    <img src="handstalk character.png" alt="HandsTalk Logo" class="logo-icon">
                    <img src="handstalk text.png" class="logo-icon1">
                </div>
                <div class="nav-container">
                    <ul class="nav-links">
                        <li><a href="home.html">Home</a></li>
                        <li><a href="about us.html">About Us</a></li>
                        <li><a href="cg alpha.html">Categories</a></li>
                        <li><a href="search.html">Search</a></li>
                        <li><a href="contact.html">Contact</a></li>
                        <li><a href="profile.html">Profile</a></li>
                    </ul>
                </div>
            </nav>
            
<div class="auth-card">

    <!-- SIGN UP TITLE -->
    <h2 class="form-title">Sign Up</h2>

    <!-- INPUT FIELDS -->
    <input type="text" placeholder="First Name" class="input-field">
    <input type="text" placeholder="Last Name" class="input-field">
    <input type="email" placeholder="Email" class="input-field">
    <input type="password" placeholder="Password" class="input-field">
    <input type="password" placeholder="Confirm Password" class="input-field">

    <!-- LOGIN LINK -->
    <div class="guest-option">
        Already have an account?
        <a href="login.html" class="guest-link">Login</a>
    </div>

    <!-- BUTTON -->
    <a href="home.html"><button class="btn btn-primary">Sign Up</button></a>

</div>
            
            <!-- Character -->
            <div class="character">
                <img src="hi.png" alt="HandsTalk Character">
            </div>
        </div>
    </div>
</body>
</html>
